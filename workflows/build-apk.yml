name: Build Android APK (Offline Voice Assistant)

# يعمل هذا السير عند دفع أي كود للفرع الرئيسي (main) أو تشغيله يدوياً
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك الضغط على Run workflow يدوياً من واجهة GitHub

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17 (المطلوبة لـ Android SDK 34/35)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعطاء صلاحية التنفيذ لملف الـ Gradle Wrapper
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      # 4. بناء ملف APK للتطبيق (Debug APK)
      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 5. رفع ملف الـ APK المولد في قسم Artifacts لتقوم بتحميله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVoiceAssistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
